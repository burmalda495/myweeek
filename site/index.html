*{box-sizing:border-box}

.pill:disabled{opacity:.35}
.big{font-size:36px;font-weight:800;text-align:center;margin:16px 0 6px}
.wiz-range{width:100%;accent-color:var(--accent);margin:8px 0 16px}
.ration{padding:12px 0;border-bottom:1px solid var(--line)}
.ration:last-child{border:0}
.task-name,.muted,.card,.ration,.notice,.modal-card,.stat{overflow-wrap:anywhere;word-break:break-word}
.row>*,.task>*,.field>*{min-width:0}
.task .pill,.row .pill{flex-shrink:0}

/* ===== STUDY MODULE (раздел «Учёба»): CSS START ===== */
.tabs{grid-template-columns:repeat(7,1fr);gap:2px;padding-left:4px;padding-right:4px}

.toast{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:min(100%,420px);background:var(--panel2);color:var(--text);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px #0006}

/* ===== REDESIGN v7: modern look + motion ===== */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root[data-theme=dark]{--bg:#0a0c0f;--panel:#14171dd9;--panel2:#1c2027;--line:#ffffff17;--text:#f4f6f8;--muted:#8f97a4;--accent:#b8f35e;--accent2:#4fe3c1;--sel:#b8f35e1c;--track:#ffffff14;--tabbar:#14171de8;--tabon:#b8f35e1f;--tabtx:#8a92a0;--nborder:#b8f35e44;--overlay:#05070aaa;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(800px 480px at 90% -8%,#b8f35e1f,transparent 60%),radial-gradient(650px 480px at -12% 8%,#4fe3c11c,transparent 60%),var(--bg) fixed;padding-bottom:116px;-webkit-tap-highlight-color:transparent}

.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 10px 24px -10px #b8f35e99}

.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22}
.donut .bg{stroke:#ffffff12}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.st-m{margin-top:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.sbar{height:12px;border-radius:12px;background:var(--track);overflow:hidden;margin-top:8px}
.sbar span{display:block;height:100%;width:0;border-radius:12px;transition:width 1.1s var(--ease) .3s}
.st-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.st-tiles.two{grid-template-columns:repeat(2,1fr)}
.st-tile{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;font-size:12px;color:var(--muted)}
.st-tile b{display:block;font-size:24px;font-weight:800;margin-top:4px;color:var(--text);font-variant-numeric:tabular-nums}
.st-b{margin-top:12px}
.hcard{display:block;width:100%;text-align:left;color:var(--text);transition:transform .3s var(--spring)}
.hcard:active{transform:scale(.97)}

#tw{position:fixed;inset:0;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(700px 420px at 88% -5%,#b8f35e26,transparent 60%),radial-gradient(600px 420px at -10% 22%,#4fe3c122,transparent 60%),#0a0c0f;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);animation:sfull .55s var(--ease)}
#tw.out{animation:sfullout .26s forwards}
.tw-h{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:6px 0 14px}
.tw-opts{display:grid;gap:10px}
.tw-o{width:100%;text-align:left;padding:16px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;transition:transform .3s var(--spring),background .25s,border-color .25s,box-shadow .25s}
.tw-o:active{transform:scale(.96)}
.tw-o.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a1405;border-color:transparent;box-shadow:0 10px 24px -10px #b8f35e99}
.tw-ex{padding:10px 0;border-bottom:1px solid var(--line)}
.tw-info{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.tw-info.open{grid-template-rows:1fr}
.tw-info>div{overflow:hidden}
.tw-t{margin:10px 0 2px;padding:12px;border-radius:14px;background:var(--sel);border:1px solid var(--nborder);font-size:14px;line-height:1.5}

.day:disabled{opacity:.28;pointer-events:none}
.sportlink{cursor:pointer;align-items:center;justify-content:space-between;transition:transform .3s var(--spring)}
.sportlink:active{transform:scale(.97)}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;padding:2px 0;font-weight:700}
.meal-h::after{content:"\203a";order:3;color:var(--muted);font-size:20px;transition:transform .35s var(--spring)}
.meal-h.open::after{transform:rotate(90deg)}
.meal-sum{font-weight:600;font-size:13px;margin-left:auto}
.meal-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.meal-body.open{grid-template-rows:1fr}
.meal-in{overflow:hidden;min-height:0}
.cust-l{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}
.cust-add{display:flex;gap:8px;margin-top:12px}
.cust-add input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit}
.cust-add .btn{padding:12px 16px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.setchk{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:13px;cursor:pointer;transition:transform .3s var(--spring),background .25s}
.setchk:active{transform:scale(.92)}
.setchk.done{background:var(--sel);border-color:var(--nborder)}

.fdov{position:fixed;inset:0;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(700px 420px at 88% -5%,#b8f35e26,transparent 60%),radial-gradient(600px 420px at -10% 22%,#4fe3c122,transparent 60%),#0a0c0f;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);animation:sfull .55s var(--ease)}
.fdov.out{animation:sfullout .26s forwards}
.foodbtn{width:100%;margin:2px 0 12px}
.fd-scan{position:relative;border-radius:24px;overflow:hidden;margin:6px 0 16px;background:#000}
.fd-scan img{display:block;width:100%;max-height:46vh;object-fit:cover;filter:brightness(.8)}
.fd-scan i{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 24px 6px #b8f35e88;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 4px)}}
.fd-thumb{width:100%;max-height:200px;object-fit:cover;border-radius:20px;margin:4px 0 12px}
.fd-tot{position:sticky;bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.pill.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a1405;border-color:transparent}.fd-gn{width:76px;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-weight:800;text-align:center}

.tabs{touch-action:none;-webkit-user-select:none;user-select:none}
.tabs.drag .tabind{transition:transform .12s ease-out,width .2s,box-shadow .2s;background:#b8f35e30;box-shadow:0 8px 28px #b8f35e55,0 0 0 1px var(--nborder) inset}
.tabs button .ic{display:inline-block;transition:transform .3s var(--spring)}
.tabs button.hov .ic{transform:scale(1.3) translateY(-3px)}
.tabs button.hov{color:var(--text)}

.tchip{display:inline-block;margin:4px 0 0 8px;padding:2px 8px;border-radius:10px;background:var(--sel);border:1px solid var(--nborder);font-size:12px;font-weight:700;color:var(--accent)}
.meal-h .tchip{margin:0 0 0 8px}
.task.now{background:var(--sel);box-shadow:0 0 0 1px var(--nborder) inset;border-radius:14px}
.tm-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tm-row input,#remTime{width:104px;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:#5c6470}
.sdot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.pushbn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;max-width:520px;margin:auto;z-index:60;display:flex;gap:12px;align-items:center;padding:14px;border-radius:22px;background:#1c2027ee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -10px #000c;animation:toastin .5s var(--spring)}
.pushbn.out{animation:fadeout .3s forwards}
.pb-i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:22px}
.pb-t{font-weight:800}.pb-b{font-size:13px;color:var(--muted)}.pb-n{margin-left:auto;font-size:11px;color:var(--muted)}
.gymask{position:fixed;left:12px;right:12px;bottom:96px;max-width:560px;margin:auto;z-index:30;padding:14px;border-radius:20px;background:#1c2027f2;border:1px solid var(--nborder);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;gap:10px;animation:toastin .5s var(--spring)}
.gymask b{flex:1}.gymask .btn{padding:10px 14px}

.qrwrap{display:inline-block;background:#fff;padding:10px;border-radius:16px}
.qrwrap svg{display:block;width:200px;height:200px}
.task.vanish{animation:vanish .28s ease forwards;overflow:hidden}
@keyframes vanish{to{opacity:0;transform:translateX(34px);max-height:0;padding-top:0;padding-bottom:0;margin:0}}
*{touch-action:manipulation}input,textarea,select{font-size:16px!important}body{-webkit-text-size-adjust:100%}</style>
</head>
<body>
<header class="top">
  <div><div class="brand">MY WEEK</div><div id="subtitle">Твоя неделя</div></div>
  <button id="settingsBtn">⚙</button>
</header>
<main id="app"></main>
<nav class="tabs"><span class="tabind"></span>
  <button data-tab="plan"><span class="ic">📋</span><small>План</small></button>
  <button data-tab="edit"><span class="ic">✏️</span><small>Правка</small></button>
  <button data-tab="training"><span class="ic">🏋️</span><small>Спорт</small></button>
  <button data-tab="nutrition"><span class="ic">🍴</span><small>Питание</small></button>
  <button data-tab="study"><span class="ic">📚</span><small>Учёба</small></button>
  <button data-tab="reminders"><span class="ic">⏰</span><small>Напомин.</small></button>
  <button data-tab="history"><span class="ic">📊</span><small>История</small></button>
</nav>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal">×</button><div id="modalContent"></div></div></div>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>
<script>
const KEY="MY_WEEK_DATA";
const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DAY_NAMES=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MEALS=["Завтрак","Обед","Ужин"];
const MACROS=["Белки","Жиры","Углеводы"];
const defaults={week:1,selectedDay:0,tab:"plan",
templates:[
["Школа","Завтрак","Обед","Подготовка к ЕГЭ","Ужин","Подготовка к ЕГЭ","Душ","Чтение книги"],
["Школа","Завтрак","Обед","Подготовка к ЕГЭ","Ужин","Душ"],
["Школа","Завтрак","Обед","Подготовка к ЕГЭ","Ужин","Душ","Чтение книги"],
["Школа","Завтрак","Обед","Подготовка к ЕГЭ","Ужин","Душ"],
["Школа","Завтрак","Обед","Пробник по русскому","Ужин","Душ"],
["Завтрак","Обед","Пробник по русскому","Ужин","Душ"],
["Завтрак","Обед","Пробник по русскому","Ужин","Душ"]],
workouts:[],targets:[[30,20,50],[40,25,60],[40,25,60]],rations:[],activeRation:null,weight:70,steps:{},days:{},meals:{},reminders:[],history:[]};
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"id"+Date.now()+Math.random().toString(16).slice(2);

function load(){
  try{return {...clone(defaults),...JSON.parse(localStorage.getItem(KEY))};}
  catch{return clone(defaults);}
}
let data=load();
const pad=n=>String(n).padStart(2,"0");
const isoOf=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const mondayOf=dt=>{const x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x;};
const dateOf=d=>{const [y,m,dd]=data.weekStart.split("-").map(Number);return new Date(y,m-1,dd+d);};
const fmtLong=dt=>dt.toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
const fmtShort=dt=>dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const remsFor=d=>data.reminders.filter(r=>r.date===isoOf(dateOf(d)));
let pickedDate=null,remText="";
function todayIdx(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((t-dateOf(0))/864e5);return diff>=0&&diff<7?diff:-1;}
function fixWeek(){if(!data.weekStart)data.weekStart=isoOf(mondayOf(new Date()));const ti=todayIdx();if(ti>=0)data.selectedDay=ti;}
fixWeek();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}

/* Окна вместо alert/confirm/prompt */
function openModal(html){$("modalContent").innerHTML=html;$("modal").classList.remove("hidden");growAll();}
function closeModal(){$("modal").classList.add("hidden");}
function ask(msg,ok="Да"){return new Promise(res=>{
  openModal(`<p style="white-space:pre-line">${esc(msg)}</p><div class="actions"><button class="btn" id="yes">${ok}</button><button class="btn secondary" id="no">Отмена</button></div>`);
  $("yes").onclick=()=>{closeModal();res(true);};
  $("no").onclick=()=>{closeModal();res(false);};
});}
function say(msg){return new Promise(res=>{
  openModal(`<p style="white-space:pre-line">${esc(msg)}</p><div class="actions"><button class="btn" id="ok">ОК</button></div>`);
  $("ok").onclick=()=>{closeModal();res();};
});}

function dayData(d){const k=`${data.week}-${d}`;if(!data.days[k])data.days[k]={tasks:null,finished:false};return data.days[k];}
function mealData(d,m){const k=`${data.week}-${d}-${m}`;if(!data.meals[k])data.meals[k]={values:[0,0,0]};return data.meals[k];}
function makeTasks(d){
  const day=dayData(d);
  if(!day.tasks){
    day.tasks=data.templates[d].map((name,i)=>({id:`task-${d}-${i}-${name}`,name,done:false}));
    addWorkoutTasks(d,day.tasks);
  }
  return day.tasks;
}
function addWorkoutTasks(d,list){
  data.workouts.filter(w=>w.days.includes(d)).forEach(w=>{
    w.exercises.forEach((ex,i)=>{
      for(let n=1;n<=ex.sets;n++)list.push({id:`${w.id}-${i}-${n}`,name:`${w.name}: ${ex.name} — подход ${n}`,done:false,set:true,wid:w.id,wname:w.name,ei:i,ex:ex.name,n,sets:ex.sets,reps:ex.reps||0});
    });
  });
}
function refreshWorkouts(){
  for(let d=0;d<7;d++){
    const day=dayData(d);
    if(day.finished||!day.tasks)continue;
    const old=day.tasks.filter(t=>t.set);
    day.tasks=day.tasks.filter(t=>!t.set);
    addWorkoutTasks(d,day.tasks);
    day.tasks.forEach(t=>{if(t.set){const o=old.find(x=>x.id===t.id);if(o)t.done=o.done;}});
  }
}
const mealDone=(d,m)=>mealData(d,m).values.every((v,i)=>v>=data.targets[m][i]);
function taskDone(d,t){const m=MEALS.indexOf(t.name);return m>=0?mealDone(d,m):!!t.done;}
function progress(d){
  const tasks=makeTasks(d),rs=remsFor(d);
  const cu=(dayData(d).custom||[]),done=tasks.filter(t=>taskDone(d,t)).length+rs.filter(r=>r.done).length+cu.filter(c=>c.done).length,total=tasks.length+rs.length+cu.length;
  return {done,total,percent:total?Math.round(done/total*100):0};
}
const kcalOf=m=>Math.round(m[0]*4+m[2]*4+m[1]*9);
const KCAL_STEP=0.00055; // ккал на 1 шаг на 1 кг веса (≈0,04 ккал/шаг при 70 кг)
const stepsOf=d=>+(data.steps[`${data.week}-${d}`]||0);
function setKcal(t){const w=data.weight||70;const min=(t.reps||10)*4/60+1;return 5*w*min/60;} // сила ≈5 MET: повторения ×4 с + 1 мин отдыха
function burned(d){const wk=Math.round(makeTasks(d).filter(t=>t.set&&t.done).reduce((a,t)=>a+setKcal(t),0));const st=Math.round(stepsOf(d)*(data.weight||70)*KCAL_STEP);const bm=bmrOf();return {wk,st,bm,total:wk+st+bm};}
/* Основной обмен (калории, которые организм тратит за сутки в покое): формула Миффлина — Сан-Жеора.
   Параметры (рост, вес, возраст, пол) берутся из применённого рациона: data.body */
function bmrCalc(p){return Math.round(10*p.w+6.25*p.h-5*p.a+(p.sex==="f"?-161:5));}
function bmrOf(){const b=data.body;return(b&&b.w>0&&b.h>0&&b.a>0)?bmrCalc(b):0;}
function totals(d){const r=[0,0,0];for(let m=0;m<3;m++)mealData(d,m).values.forEach((v,i)=>r[i]+=v);return r;}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===data.tab));
  ({plan:renderPlan,edit:renderEdit,training:renderTraining,nutrition:renderNutrition,study:renderStudy,reminders:renderReminders,history:renderHistory})[data.tab]($("app"));
  growAll();
  save();
}
function daySelector(){
  return `<div class="days">${DAYS.map((n,i)=>{const p=progress(i);
    return `<button class="day ${i===data.selectedDay?"selected":""} ${i===todayIdx()?"today":""}" data-day="${i}"><strong>${n}</strong><span class="dnum">${dateOf(i).getDate()}</span><small>${p.done}/${p.total}</small></button>`;}).join("")}</div>`;
}
function bindDays(el){el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{data.selectedDay=+b.dataset.day;render();});}

function renderPlan(el){
  const d=data.selectedDay,day=dayData(d),tasks=makeTasks(d),p=progress(d),macros=totals(d),seen={},rems=remsFor(d),bn=burned(d);
  el.innerHTML=`
  <div class="section-title">План недели</div>
  <div class="row"><span class="muted">Неделя ${data.week} · ${fmtShort(dateOf(0))} – ${fmtShort(dateOf(6))}</span><span class="pill">${DAY_NAMES[d]}, ${fmtLong(dateOf(d))}</span></div>
  ${daySelector()}
  <div class="card">
    <div class="row hero"><div class="ring" style="--p:${p.percent}" data-p="${p.percent}"><b>${p.percent}%</b></div><div class="hero-t"><b style="font-size:17px">Прогресс дня</b><div class="muted" style="margin:4px 0 10px">${p.done} из ${p.total} выполнено</div><div class="progress"><span style="width:${p.percent}%"></span></div></div></div>
  </div>
  <div class="card"><b>Задачи дня</b>
  ${tasks.map(t=>{if(t.wid){if(seen[t.wid])return "";seen[t.wid]=1;return sportLink(tasks.filter(x=>x.wid===t.wid),d);}
    const m=MEALS.indexOf(t.name),done=taskDone(d,t);
    if(m>=0)return `<div class="task ${done?"done":""}"><input type="checkbox" ${done?"checked":""} disabled>
    <div class="task-name"><div class="meal-h${mealOpen[d+"-"+m]?" open":""}" data-meal-toggle="${d}-${m}">${esc(t.name)}<span class="muted meal-sum">${mealData(d,m).values.reduce((a,b)=>a+b,0)} / ${data.targets[m].reduce((a,b)=>a+b,0)} г</span></div><div class="meal-body${mealOpen[d+"-"+m]?" open":""}"><div class="meal-in">${day.finished?"":`<button class="btn secondary foodbtn" data-food="${m}">📷 Посчитать БЖУ по фото</button>`}${MACROS.map((n,i)=>{const mx=Math.max(1,data.targets[m][i]),v=Math.min(mealData(d,m).values[i],mx);return `<div class="macro-head"><span class="muted">${n}</span><b class="muted">${v} / ${data.targets[m][i]} г</b></div><input type="range" min="0" max="${mx}" value="${v}" data-meal="${m}-${i}" ${day.finished?"disabled":""}>`;}).join("")}</div></div></div></div>`;
    return `<label class="task ${done?"done":""}"><input type="checkbox" data-task="${esc(t.id)}" ${done?"checked":""} ${day.finished?"disabled":""}>
    <span class="task-name">${esc(t.name)}</span></label>`;}).join("")}
  </div>
  ${customCard(d,day)}${rems.length?`<div class="card"><b>Напоминания на этот день</b>${rems.map(r=>`<label class="task ${r.done?"done":""}"><input type="checkbox" data-rem="${esc(r.id)}" ${r.done?"checked":""} ${day.finished?"disabled":""}><span class="task-name">🔔 ${esc(r.text)}</span></label>`).join("")}</div>`:""}
  <div class="card"><b>БЖУ за день</b><div class="week-stats">
  ${MACROS.map((m,i)=>`<div class="stat"><span class="muted">${m}</span><b>${macros[i]} г</b></div>`).join("")}</div>
  <div class="row" style="margin-top:10px"><span class="muted">Съедено калорий</span><b>${kcalOf(macros)} ккал</b></div></div>
  <div class="card"><b>Шаги</b>
    <div class="field"><input type="number" inputmode="numeric" min="0" id="stepsInp" placeholder="Сколько шагов сегодня?" value="${stepsOf(d)||""}" ${day.finished?"disabled":""}></div>
    <div class="muted">Возьми число из «Здоровья» на iPhone и впиши сюда</div><div id="pedBox"></div></div>
  <div class="card"><b>Баланс дня</b><div class="week-stats">
    <div class="stat"><span class="muted">Съедено</span><b>${kcalOf(macros)}</b></div>
    <div class="stat"><span class="muted">Сожжено</span><b>${bn.total}</b></div>
    <div class="stat"><span class="muted">Разница</span><b>${kcalOf(macros)-bn.total}</b></div></div>
    <div class="row" style="margin-top:10px"><span class="muted">Основной обмен (за сутки)</span><b>${bn.bm} ккал</b></div><div class="muted" style="margin-top:8px">В «Сожжено»: основной обмен ${bn.bm} + тренировка ≈ ${bn.wk} + шаги ≈ ${bn.st} ккал. ${bn.bm?"":"Основной обмен пока не учтён: разработай и примени рацион в разделе «Питание» (рост, вес, возраст, пол). "}Значения приблизительные.</div></div>

function syncDay(d){
  const day=data.days[`${data.week}-${d}`];
  if(!day||!day.tasks||day.finished)return;
  const pool=day.tasks.filter(t=>!t.set);
  const fresh=data.templates[d].map((name,i)=>{
    const k=pool.findIndex(t=>t.name===name);
    const done=k>=0?pool.splice(k,1)[0].done:false;
    return {id:`task-${d}-${i}-${name}`,name,done};
  });
  day.tasks=fresh.concat(day.tasks.filter(t=>t.set));
}

function calcRation(p){
  const bmr=10*p.w+6.25*p.h-5*p.a+(p.sex==="m"?5:-161);
  const k=p.goal==="mass"?1.1:(p.a<18?0.9:0.85);
  const kcal=Math.round(bmr*1.55*k/10)*10;
  const prot=Math.round(p.w*(p.goal==="mass"?1.8:2.2)),fat=Math.round(p.w*(p.goal==="mass"?1:0.8));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {kcal,targets:[0.3,0.4,0.3].map(s=>[Math.round(prot*s),Math.round(fat*s),Math.round(carb*s)])};
}

async function finishDay(d){
  const p=progress(d),m=totals(d),bn=burned(d);
  if(!await ask(`Завершить день?\nВыполнено ${p.done} из ${p.total}`))return;
  const day=dayData(d);
  day.finished=true;day.stats={done:p.done,total:p.total,macros:m,eaten:kcalOf(m),burned:bn.total,bn:{bm:bn.bm,wk:bn.wk,st:bn.st},steps:stepsOf(d)};
  save();render();
  await showStats(dayView(d));
}
function weekStats(){
  const macros=[0,0,0];let done=0,total=0,sets=0,eaten=0,burn=0,steps=0;
  for(let d=0;d<7;d++){
    const p=progress(d);done+=p.done;total+=p.total;
    totals(d).forEach((v,i)=>macros[i]+=v);
    sets+=makeTasks(d).filter(t=>t.set&&t.done).length;
    const dd=dayData(d);eaten+=kcalOf(totals(d));burn+=dd.finished&&dd.stats&&dd.stats.burned!=null?dd.stats.burned:burned(d).total;steps+=stepsOf(d);
  }
  return {done,total,macros,sets,eaten,burn,steps};
}
async function finishWeek(){
  if(!await ask("Завершить неделю и сохранить статистику?"))return;
  const s=weekStats();
  data.history=data.history.filter(h=>h.week!==data.week);
  data.history.push({week:data.week,date:new Date().toISOString(),weekStart:data.weekStart,...s});
  save();
  await showStats(weekView({weekStart:data.weekStart,...s}));

    const next=new Date(dateOf(0));next.setDate(next.getDate()+7);
    const mon=mondayOf(new Date());
    data.weekStart=isoOf(next>mon?next:mon);
    data.week++;data.days={};data.meals={};data.selectedDay=0;fixWeek();render();
  }
}

function openCalendar(){
  const base=pickedDate?parseISO(pickedDate):new Date(),now=new Date();
  let y=base.getFullYear(),m=base.getMonth();
  const today=isoOf(now),cur=now.getFullYear()*12+now.getMonth();
  const draw=()=>{
    const lead=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();
    let cells="";
    for(let i=0;i<lead;i++)cells+="<span></span>";
    for(let n=1;n<=count;n++){
      const iso=`${y}-${pad(m+1)}-${pad(n)}`;
      cells+=`<button class="cal-day ${iso===today?"today":""} ${iso===pickedDate?"sel":""}" data-iso="${iso}" ${iso<today?"disabled":""}>${n}</button>`;
    }
    openModal(`<div class="cal-head"><button class="pill" id="prevM" ${y*12+m<=cur?"disabled":""}>‹</button><b>${new Date(y,m,1).toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</b><button class="pill" id="nextM">›</button></div>
    <div class="cal-grid">${DAYS.map(n=>`<small class="muted">${n}</small>`).join("")}${cells}</div>`);
    $("prevM").onclick=()=>{m--;if(m<0){m=11;y--;}draw();};
    $("nextM").onclick=()=>{m++;if(m>11){m=0;y++;}draw();};
    document.querySelectorAll("[data-iso]").forEach(b=>b.onclick=()=>{pickedDate=b.dataset.iso;closeModal();render();});
  };
  draw();
}

/* ===== STUDY MODULE (раздел «Учёба»): JS START =====
   Расписание уроков по дням недели + домашние задания по предметам.
   Данные хранятся в data.study = { schedule: [7 массивов названий предметов],
                                    hw: [{id, subject, text, done, doneAt}] }
   Из основного приложения нужны: data, save, render, esc, uid, $, openModal, closeModal,
   grow, growAll, DAYS, DAY_NAMES, dateOf, fmtLong, todayIdx. См. INSTALL.md */
let studyEdit=false,studyOpenSubject=null;
const studyPending=new Map(),studyToasts=new Map();

function studyData(){
  const s=data.study;
  if(!s||!Array.isArray(s.schedule)||s.schedule.length!==7)
    data.study={schedule:[[],[],[],[],[],[],[]],hw:(s&&Array.isArray(s.hw))?s.hw:[]};
  if(!Array.isArray(data.study.hw))data.study.hw=[];
  return data.study;
}
const hwVisible=h=>!h.done||studyPending.has(h.id);
const hwOpen=name=>studyData().hw.filter(h=>h.subject===name&&!h.done).length;
const hwTotalOpen=()=>studyData().hw.filter(h=>!h.done).length;
function studySubjects(){
  const s=studyData(),out=[];
  s.schedule.forEach(day=>day.forEach(n=>{if(!out.includes(n))out.push(n);}));
  s.hw.forEach(h=>{if(hwVisible(h)&&!out.includes(h.subject))out.push(h.subject);});
  return out;
}
function studyName(v){
  v=v.trim().replace(/\s+/g," ");

/* Отметка выполнено: пункт исчезает через 4 секунды, 4 секунды можно вернуть */
function hwCheck(id){
  const it=studyData().hw.find(h=>h.id===id);
  if(!it||it.done)return;
  it.done=true;it.doneAt=Date.now();

  hwToast(it);refreshStudy();
}
function hwUndo(id){

}
function hwToast(it){

/* ===== PEDOMETER MODULE (автоматический подсчёт шагов): START =====
   Считает шаги по датчику движения телефона и добавляет их в data.steps за сегодняшний день
   (то же поле, что и ручной ввод). Нужны: data, save, render, $, say, todayIdx, dayData */
let pedRun=false,pedBase=9.8,pedAbove=false,pedLast=0,pedUnsaved=0,pedLock=null,pedDrawn=0;
function pedKey(){const i=todayIdx();return i>=0?`${data.week}-${i}`:null;}
function pedMount(el,d){
  const box=el.querySelector("#pedBox");if(!box)return;
  const can=d===todayIdx()&&!dayData(d).finished;
  box.innerHTML=can?`<div class="actions">${pedRun?'<button class="btn" id="pedStop">Остановить подсчёт</button>':'<button class="btn secondary" id="pedStart">Считать шаги по датчику</button>'}</div><div class="muted" style="margin-top:8px">${pedRun?"Идёт подсчёт… ":""}Работает только пока приложение открыто и экран включён, считает приблизительно.</div>`:"";
  const s=box.querySelector("#pedStart"),t=box.querySelector("#pedStop");
  if(s)s.onclick=pedStart;
  if(t)t.onclick=()=>pedStop(true);
}
function pedLive(force){
  const now=Date.now();
  if(!force&&now-pedDrawn<2500)return;
  if(data.tab!=="plan"||data.selectedDay!==todayIdx()||!$("modal").classList.contains("hidden"))return;
  pedDrawn=now;render();
}
function pedAdd(){
  const k=pedKey();
  if(!k||dayData(todayIdx()).finished){pedStop(true);return;}
  data.steps[k]=(+data.steps[k]||0)+1;
  if(++pedUnsaved>=10){save();pedUnsaved=0;}
  pedLive(false);
}
function pedMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null)return;
  const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  pedBase=pedBase*0.98+m*0.02;
  const diff=m-pedBase,now=Date.now();
  if(!pedAbove&&diff>1.2&&now-pedLast>320){pedAbove=true;pedLast=now;pedAdd();}
  else if(pedAbove&&diff<0.3)pedAbove=false;
}
async function pedStart(){
  if(!pedKey()){await say("Сегодняшний день не входит в текущую неделю. Заверши неделю, и подсчёт заработает.");return;}
  if(!("DeviceMotionEvent" in window)){await say("На этом устройстве нет датчика движения.");return;}
  try{
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      if(await DeviceMotionEvent.requestPermission()!=="granted"){
        await say("Доступ к датчикам движения не разрешён. Его можно включить в настройках Safari для этого сайта.");return;
      }
    }
  }catch(e){await say("Не удалось получить доступ к датчикам движения.");return;}
  pedRun=true;pedBase=9.8;pedAbove=false;
  window.addEventListener("devicemotion",pedMotion);
  try{if(navigator.wakeLock)pedLock=await navigator.wakeLock.request("screen");}catch(e){}
  pedLive(true);
}
function pedStop(redraw){
  pedRun=false;window.removeEventListener("devicemotion",pedMotion);
  if(pedLock){try{pedLock.release();}catch(e){}pedLock=null;}
  save();pedUnsaved=0;
  if(redraw)pedLive(true);
}
/* Когда приложение уходит в фон, подсчёт останавливается: датчики там не работают */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&pedRun)pedStop(false);
  else if(!document.hidden)pedLive(true);
});

/* ===== v8: sliders with fill and +/- , reminder undo ===== */
const prevF={},remPending=new Map(),remToasts=new Map();
const sPct=i=>(i.value-i.min)/((i.max-i.min)||1)*100;
function sFill(i){const p=sPct(i);i.style.setProperty("--fill",p);if(i._k)prevF[i._k]=p;}
function sHold(b,inp,dir){
  let t1,t2,moved=false;
  const go=()=>{const st=+inp.step||1,mn=+inp.min||0,mx=+inp.max,v=Math.min(mx,Math.max(mn,+inp.value+dir*st));if(v===+inp.value)return;inp.value=v;moved=true;inp.dispatchEvent(new Event("input",{bubbles:true}));};
  const stop=()=>{clearTimeout(t1);clearInterval(t2);if(moved){moved=false;inp.dispatchEvent(new Event("change",{bubbles:true}));}};
  b.addEventListener("pointerdown",e=>{e.preventDefault();go();t1=setTimeout(()=>{t2=setInterval(go,70);},380);});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
}
function enhance(root){
  root.querySelectorAll("input[type=range]").forEach((inp,i)=>{
    if(inp.closest(".rng"))return;
    const w=document.createElement("div");w.className="rng";
    const mk=(t,l)=>{const b=document.createElement("button");b.type="button";b.className="step";b.textContent=t;b.setAttribute("aria-label",l);b.disabled=inp.disabled;return b;};
    const mn=mk("\u2212","Меньше"),pl=mk("+","Больше");
    inp.parentNode.insertBefore(w,inp);w.append(mn,inp,pl);
    sHold(mn,inp,-1);sHold(pl,inp,1);
    inp.addEventListener("input",()=>sFill(inp));
    inp.addEventListener("pointerdown",()=>inp.classList.add("drag"));
    ["pointerup","pointercancel"].forEach(ev=>inp.addEventListener(ev,()=>inp.classList.remove("drag")));
    inp._k=(root.id||"")+data.tab+data.selectedDay+"f"+i;
    inp.style.setProperty("--fill",prevF[inp._k]??0);void inp.offsetWidth;sFill(inp);
  });
}

let tw={};
function twGen(){
  const a=tw,days=[...a.days].sort((x,y)=>x-y).slice(0,6),n=days.length;
  const sp=(n===3&&a.lvl>1)?["pu","pl","le"]:TW_SPLIT[n],per=a.min===45?5:a.min===60?6:8,rank={n:0,d:1,g:2},eqOK={n:"n",d:"nd",g:"ndg"}[a.eq];
  const foc=a.focus==="arms"?["bi","tr"]:a.focus==="lg"?["lg","gl"]:a.focus==="none"?[]:[a.focus],used=new Set(),seen={};
  return days.map((d,k)=>{
    const t=sp[k],gs=TW_S[t][1],order=[...gs.filter(g=>foc.includes(g)),...gs.filter(g=>!foc.includes(g))],picks=[];
    seen[t]=(seen[t]||0)+1;
    for(let i=0;picks.length<per&&i<40;i++){
      const g=order[i%order.length];
      const c=EX.map((e,ix)=>({e,ix})).filter(o=>o.e.g===g&&eqOK.includes(o.e.e)&&o.e.l<=a.lvl&&!picks.includes(o.ix)&&![...o.e.a].some(x=>a.pains.includes(x)));
      c.sort((p,q)=>(used.has(p.ix)-used.has(q.ix))||(rank[q.e.e]-rank[p.e.e]));
      if(c[0]){picks.push(c[0].ix);used.add(c[0].ix);}
    }
    const exs=picks.map((ix,j)=>{
      const e=EX[ix];
      const sets=a.lvl===1?3:(j<2&&(a.goal==="mass"||a.goal==="strength")?4:3);
      let reps=a.goal==="strength"?(j<2?5:8):a.goal==="mass"?10:12;
      if(a.goal==="strength"&&e.e==="n")reps=12;
      if(e.n.includes("секунд"))reps=40;
      return{i:ix,sets,reps};
    });
    return{d,name:TW_S[t][0]+(sp.filter(x=>x===t).length>1?" "+"АБВ"[seen[t]-1]:""),exs};

banana:["Банан",90,1.5,.2,21,1,120],apple:["Яблоко",52,.3,.2,14,.8,150],yogurt:["Йогурт",65,4,2,7,1.03],milk:["Молоко 3,2%",60,2.9,3.2,4.7,1.03],juice:["Сок",45,.5,.1,11,1.04],

// Посуда: [ключ подсказки (fd.hint), название на кнопке, id]; размеры по умолчанию: [мл до краёв, диаметр см, форма cyl|cap|mix]
const FD_CONT=[["","Не указывать","deep"],["обычная тарелка","Обычная тарелка","plate"],["маленькая тарелка","Маленькая тарелка","small"],["глубокая тарелка","Глубокая тарелка","deep"],["миска","Миска","bowl"],["кружка","Кружка","mug"],["контейнер","Контейнер","box"]];
const FD_DEF={plate:[0,25,"cap"],small:[0,19,"cap"],deep:[450,22,"mix"],bowl:[500,15,"cap"],mug:[300,8,"cyl"],box:[600,0,"cyl"]};

const fdLs=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const fdLsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fdCont=()=>FD_CONT.find(c=>c[0]===(fd.hint||""))||FD_CONT[0];
function fdDims(){const c=fdCont(),d=FD_DEF[c[2]],o=(fdLs("fd_vol",{})[c[2]])||{};return{label:c[1],ml:o.ml!=null?o.ml:d[0],d:o.d!=null?o.d:d[1],shape:d[2]}}
const fdCtx=()=>{const d=fdDims();return d.label+", объём до краёв "+(d.ml||"не важен")+" мл, диаметр "+(d.d||"?")+" см"+(fd.hint?"":" (посуду пользователь не указал, оцени по фото)")};

const FD_PROMPT=c=>`Ты помогаешь посчитать еду по фото. Граммы не называй: вес посчитает программа по твоим наблюдениям.
Для каждой позиции верни: id из списка (если нет подходящего, id=other, name по-русски и kcal,p,f,c на 100 г и density г/мл); mode: "volume" (суп, каша, пюре, напитки, всё внутри посуды с бортами; укажи level), "plate" (еда на плоской тарелке; укажи coverage и thickness), "pieces" (штучные; укажи count); level: высота уровня еды от дна относительно глубины посуды в % (остатки 5–15, половина 50, до краёв 100); coverage: какую часть площади тарелки занимает позиция, %; thickness: средняя толщина слоя, см; confidence: "low", если объём плохо виден, иначе "high".
Посуда: ${c}. Для масштаба используй ложку или вилку (18–19 см), если они в кадре. Не завышай и не занижай. Остатки это маленькие значения. Не больше 8 позиций. Верни только JSON {"items":[{"id":"borsch","mode":"volume","level":40,"confidence":"high"}]}, если еды нет, {"items":[]}.`;

const fdChips=()=>{const d=fdDims();return '<div class="card"><b>Моя посуда</b><div class="muted" style="margin:4px 0 10px">Один раз измерь объём до краёв (налей воды и перелей в мерный стакан). Это сильно повышает точность.</div><div class="chips">'+FD_CONT.map((c,i)=>'<button class="pill'+((fd.hint||"")===c[0]?" on":"")+'" data-cont="'+i+'">'+c[1]+'</button>').join("")+'</div><div class="cust-add" style="margin-top:10px"><input id="fdMl" inputmode="numeric" placeholder="Объём, мл" value="'+(d.ml||"")+'"><input id="fdDm" inputmode="numeric" placeholder="Диаметр, см" value="'+(d.d||"")+'"></div><div class="muted" style="margin-top:10px">Если есть кухонные весы, введи вес всей порции без тарелки: тогда ошибка станет в разы меньше.</div><div class="cust-add" style="margin-top:6px"><input id="fdTotIn" inputmode="numeric" placeholder="Вес порции, г (необязательно)" value="'+(fd.total||"")+'"></div><div class="muted" style="margin-top:10px">Снимай сверху, чтобы была видна вся посуда, и положи рядом ложку или вилку. Суп лучше снимать чуть сбоку, чтобы был виден уровень.</div></div>'};
document.addEventListener("input",e=>{const i=e.target.id;if(i==="fdTotIn")fd.total=+e.target.value||0;
  if(i==="fdMl"||i==="fdDm"){const id=fdCont()[2],v=fdLs("fd_vol",{});v[id]=v[id]||{};v[id][i==="fdMl"?"ml":"d"]=+e.target.value||0;fdLsSet("fd_vol",v);}});
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-cont]")){const d=fdDims(),a=$("fdMl"),b=$("fdDm");if(a)a.value=d.ml||"";if(b)b.value=d.d||"";}});

// Физика: граммы считает код. vf: доля объёма по доле высоты уровня (цилиндр, шар, между)
const fdVf=(h,s)=>{h=Math.min(1,Math.max(0,h));const k=(3*h*h-h*h*h)/2;return s==="cyl"?h:s==="cap"?k:(h+k)/2};
const fdTab=(id,x)=>id==="other"?["Продукт",+x.kcal||150,+x.p||5,+x.f||5,+x.c||15,+x.density||.9]:FD_T[id];
function fdEst(x,t,d){let g;
  if(x.mode==="pieces")g=(+x.count||1)*(t[6]||80);
  else if(x.mode==="plate"){const r=(d.d||20)/2;g=Math.PI*r*r*(+x.coverage||0)/100*Math.min(+x.thickness||1.5,6)*t[5];}
  else g=(d.ml||400)*fdVf((+x.level||0)/100,d.shape)*t[5];
  return Math.max(5,g);}


const fdR5=x=>Math.max(5,Math.round(x/5)*5);

// Самообучение: когда человек подтвердил порцию, запоминаем отношение «итог / оценка» по продукту
function fdLearn(){if(fd.total>0)return;const c=fdLs("fd_cal",{});
  fd.items.forEach(i=>{if(!i.raw||!i.id)return;const q=Math.min(3,Math.max(.3,i.g/i.raw));c[i.id]=c[i.id]?c[i.id]*.7+q*.3:q;});fdLsSet("fd_cal",c);}

/* ЕДИНСТВЕННАЯ правка в старом коде: в fdDraw, в обработчике кнопки fdApply, первой строкой вызови fdLearn():
   $("fdApply").onclick=()=>{fdLearn();const t=fdTot(), ... остальное как было
   В fdStart после fd={m,d,items:[],url:null,view:"pick"} ничего менять не нужно (fd.total и fd.hint задаются полями).
   Запрос на сервер теперь идёт на /api/food (старый путь /.netlify/functions/food на Cloudflare Pages не работает). */

const FD_ERR={no_key:"Сервер ещё не настроен: нет ключа нейросети.",rate:"Слишком много запросов. Подожди минуту.",empty:"Еду на фото не нашёл. Попробуй сфотографировать тарелку сверху при хорошем свете.",not_granted:"Доступ к Claude не разрешён.",no_ai:"Нейросеть недоступна."};

function fdClose(){const el=$("fd");if(!el)return;clearInterval(fd.t);if(fd.url)URL.revokeObjectURL(fd.url);el.classList.add("out");setTimeout(()=>{el.remove();document.body.style.overflow="";},260);}
function fdPage(h,bind){
  const el=$("fd");
  el.innerHTML='<div class="st-wrap"><div class="st-head"><div class="muted">'+MEALS[fd.m]+'</div><button class="st-x" id="fdX" aria-label="Закрыть">\u00d7</button></div>'+h+'</div>';

function fdShrink(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no({code:"fail"}),"image/jpeg",.82);};
    im.onerror=()=>no({code:"fail"});im.src=u;
  });
}
const fdB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(b);});
async function fdAnalyze(blob){
  const ids=Object.keys(FD_T);
  if(window.FOOD_VIA_CLAUDE){const s=await claude.use("sample");if(!s)throw{code:"no_ai"};
    return await s.json(FD_PROMPT(fdCtx())+" id выбирай из: "+ids.join(", ")+".",{images:[blob],modelTier:"default",cache:false});}
  const res=await fetch("/api/food",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:await fdB64(blob),container:fdCtx(),ids})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw{code:j.error||"http_"+res.status};
  return j;
}
function fdNorm(r){
  const a=((r&&r.items)||(Array.isArray(r)?r:[])).slice(0,8),d=fdDims(),cal=fdLs("fd_cal",{});
  const rows=a.map(x=>{const id=FD_T[x.id]?x.id:"other",t=fdTab(id,x);return{x,id,t,g:fdEst(x,t,d)}});
  const sum=rows.reduce((s,q)=>s+q.g,0)||1,k=fd.total>0?fd.total/sum:0;   // k: масштаб по весу с весов
  return rows.map(({x,id,t,g})=>{
    const vol=x.mode==="volume",low=!fd.hint||x.confidence==="low",gg=Math.max(5,Math.min(2000,Math.round(g*(k||cal[id]||1)/5)*5));
    return{n:id==="other"?String(x.name||"Продукт").slice(0,40):t[0],id,g:gg,raw:g,p:t[2],f:t[3],c:t[4],k:t[1],
      cont:vol?d.label:"",fill:0,cap:vol&&!k?Math.round(d.ml*t[5]/5)*5:0,sp:k?.08:x.mode==="pieces"?.15:low?.4:.25};});
}
async function fdRun(file){
  if(!file)return;
  try{
    const b=await fdShrink(file);if(fd.url)URL.revokeObjectURL(fd.url);fd.url=URL.createObjectURL(b);fd.view="load";fdDraw();
    fd.items=fdNorm(await fdAnalyze(b));
    fd.view=fd.items.length?"res":"err";if(!fd.items.length)fd.err="empty";
  }catch(e){fd.err=(e&&e.code)||"fail";fd.view="err";}
  fdDraw();
}
const fdM=it=>"Б "+Math.round(it.p*it.g/100)+" · Ж "+Math.round(it.f*it.g/100)+" · У "+Math.round(it.c*it.g/100)+" · "+Math.round(it.k*it.g/100)+" ккал"+(it.sp?" · "+fdR5(it.g*(1-it.sp))+"–"+fdR5(it.g*(1+it.sp))+" г":"");
function fdTot(){const t={p:0,f:0,c:0,k:0};fd.items.forEach(i=>{t.p+=i.p*i.g/100;t.f+=i.f*i.g/100;t.c+=i.c*i.g/100;t.k+=i.k*i.g/100;});return t;}
function fdTotHtml(){const t=fdTot();return '<div class="week-stats"><div class="stat"><span class="muted">Белки</span><b>'+Math.round(t.p)+' г</b></div><div class="stat"><span class="muted">Жиры</span><b>'+Math.round(t.f)+' г</b></div><div class="stat"><span class="muted">Углеводы</span><b>'+Math.round(t.c)+' г</b></div></div><div class="row" style="margin-top:10px"><span class="muted">Калории</span><b>'+Math.round(t.k)+' ккал</b></div>';}
function fdItem(it,i){
  const mx=Math.max(400,Math.ceil(Math.max(it.g*3,it.cap)/5)*5),fp=it.cap?Math.min(100,Math.round(it.g/it.cap*100)):0;
  return '<div class="card"><div class="row"><b>'+esc(it.n)+'</b><button class="pill" data-fdel="'+i+'">Убрать</button></div><div class="row" style="margin:8px 0 2px"><span><input class="fd-gn" inputmode="numeric" value="'+it.g+'"> г</span><span class="muted fd-m">'+fdM(it)+'</span></div><input type="range" min="0" max="'+mx+'" step="5" value="'+it.g+'" data-fdg="'+i+'">'+(it.cap?'<div class="muted" style="margin-top:10px">Заполненность посуды: <b class="fd-f">'+fp+'%</b>'+(it.cont?' · '+esc(it.cont):'')+'</div><input type="range" min="0" max="100" step="5" value="'+fp+'" data-fdf="'+i+'">':'')+'</div>';
}
function fdSet(c,it,g,src){
  it.g=g;
  const gs=c.querySelector("[data-fdg]"),gn=c.querySelector(".fd-gn"),fs=c.querySelector("[data-fdf]");
  if(src!=="g"){if(g>+gs.max)gs.max=g;gs.value=g;sFill(gs);}
  if(src!=="n")gn.value=g;
  if(fs){if(src!=="f"){fs.value=Math.min(100,Math.round(g/it.cap*100));sFill(fs);}c.querySelector(".fd-f").textContent=fs.value+"%";}
  c.querySelector(".fd-m").textContent=fdM(it);$("fdTot").innerHTML=fdTotHtml();
}
function fdDraw(){
  clearInterval(fd.t);
  const v=fd.view;
  if(v==="pick")return fdPage('<h2 class="tw-h">Посчитать БЖУ по фото</h2><div class="card"><div class="muted">Нейросеть найдёт продукты и прикинет вес порций, а ты сможешь поправить граммы. Результат примерный.</div></div>'+fdChips()+'<button class="btn" id="fdCam" style="width:100%;margin-top:12px">\ud83d\udcf7 Сделать фото</button><button class="btn secondary" id="fdGal" style="width:100%;margin-top:8px">Выбрать из галереи</button><input type="file" accept="image/*" capture="environment" id="fdI1" hidden><input type="file" accept="image/*" id="fdI2" hidden>',()=>{

    $("fdI1").onchange=e=>fdRun(e.target.files[0]);$("fdI2").onchange=e=>fdRun(e.target.files[0]);
  });
  if(v==="load")return fdPage('<div class="fd-scan"><img src="'+fd.url+'" alt=""><i></i></div><h2 class="tw-h" id="fdMsg">Определяю продукты\u2026</h2><div class="muted">Обычно это занимает несколько секунд</div>',()=>{
    const ms=["Определяю продукты\u2026","Оцениваю порции\u2026","Считаю БЖУ\u2026"];let k=0;
    fd.t=setInterval(()=>{k=(k+1)%3;const m=$("fdMsg");if(m)m.textContent=ms[k];},2200);
  });
  if(v==="err")return fdPage('<h2 class="tw-h">Не получилось</h2><div class="card">'+(FD_ERR[fd.err]||"Не удалось распознать фото. Попробуй ещё раз или другое фото.")+'</div><button class="btn" id="fdRe" style="width:100%;margin-top:12px">Попробовать снова</button><button class="btn secondary" id="fdCl" style="width:100%;margin-top:8px">Закрыть</button>',()=>{
    $("fdRe").onclick=()=>{fd.view="pick";fdDraw();};$("fdCl").onclick=fdClose;
  });
  fdPage((fd.url?'<img class="fd-thumb" src="'+fd.url+'" alt="">':"")+'<h2 class="tw-h">Проверь порции</h2><div class="muted" style="margin-bottom:8px">Камера не видит точный вес. Подвинь граммы так, как у тебя на самом деле.</div>'+fd.items.map(fdItem).join("")+'<div class="card"><b>Добавить продукт вручную</b><div class="cust-add"><input id="fmN" placeholder="Название"><input id="fmG" inputmode="numeric" placeholder="г" style="max-width:72px"></div><div class="cust-add"><input id="fmP" inputmode="decimal" placeholder="Б/100 г"><input id="fmF" inputmode="decimal" placeholder="Ж/100 г"><input id="fmC" inputmode="decimal" placeholder="У/100 г"></div><button class="btn secondary" id="fmAdd" style="width:100%;margin-top:8px">+ Добавить</button></div><div class="card fd-tot"><b>Итого</b><div id="fdTot">'+fdTotHtml()+'</div><button class="btn" id="fdApply" style="width:100%;margin-top:12px">Добавить в: '+MEALS[fd.m]+'</button></div>',el=>{
    el.querySelectorAll("[data-fdg]").forEach(r=>{const c=r.closest(".card"),it=fd.items[+r.dataset.fdg];r.oninput=()=>fdSet(c,it,+r.value,"g");c.querySelector(".fd-gn").oninput=e=>fdSet(c,it,Math.max(0,Math.min(2000,parseInt(e.target.value)||0)),"n");const fs=c.querySelector("[data-fdf]");if(fs)fs.oninput=()=>fdSet(c,it,Math.round(it.cap*fs.value/100/5)*5,"f");});
    el.querySelectorAll("[data-fdel]").forEach(b=>{b.onclick=()=>{fd.items.splice(+b.dataset.fdel,1);fdDraw();};});
    $("fmAdd").onclick=()=>{const n=$("fmN").value.trim(),g=parseFloat($("fmG").value),p=parseFloat($("fmP").value)||0,f=parseFloat($("fmF").value)||0,c=parseFloat($("fmC").value)||0;if(!n||!(g>0))return;fd.items.push({n:n.slice(0,40),g:Math.round(g),p,f,c,k:4*p+9*f+4*c});fdDraw();};
    $("fdApply").onclick=()=>{fdLearn();const t=fdTot(),vs=mealData(fd.d,fd.m).values;vs[0]=Math.round(vs[0]+t.p);vs[1]=Math.round(vs[1]+t.f);vs[2]=Math.round(vs[2]+t.c);mealOpen[fd.d+"-"+fd.m]=true;fdClose();render();};
    enhance(el);
  });
}

/* ===== v13: Telegram-style draggable tab bar ===== */
(function(){
  const nav=document.querySelector(".tabs");let drag=false,sx=0,last=null;
  const btns=()=>[...nav.querySelectorAll("button")];
  const at=x=>{const bs=btns();for(const b of bs){if(x<b.getBoundingClientRect().right)return b;}return bs[bs.length-1];};
  function place(x){
    const ind=nav.querySelector(".tabind"),nr=nav.getBoundingClientRect(),w=ind.offsetWidth;
    const l=Math.max(4,Math.min(nr.width-w-4,x-nr.left-w/2));
    ind.style.transform="translateX("+l+"px) scale(1.1)";
  }
  function mark(b){if(b===last)return;last=b;btns().forEach(x=>x.classList.toggle("hov",x===b));if(navigator.vibrate)try{navigator.vibrate(6);}catch(_){}}
  function end(e,ok){
    if(!drag)return;drag=false;nav.classList.remove("drag");
    const b=ok?at(e.clientX):null;last=null;btns().forEach(x=>x.classList.remove("hov"));
    if(b&&!b.classList.contains("active"))b.click();else moveInd();
  }
  nav.addEventListener("pointerdown",e=>{
    drag=true;sx=e.clientX;last=null;
    try{nav.setPointerCapture(e.pointerId);}catch(_){}
    nav.classList.add("drag");place(e.clientX);mark(at(e.clientX));
  });
  nav.addEventListener("pointermove",e=>{if(!drag)return;place(e.clientX);mark(at(e.clientX));});
  nav.addEventListener("pointerup",e=>end(e,true));
  nav.addEventListener("pointercancel",e=>end(e,false));
})();

const API_BASE=(window.MYWEEK_API||"").replace(/\/$/,"");

const toMin=s=>{const p=String(s).split(":");return(+p[0])*60+(+p[1]);};
const timeOf=n=>{const t=(data.times||{})[n];return t&&t[0]&&t[1]?t:null;};
function addTimes(app){
  if(data.tab!=="plan")return;
  const today=data.selectedDay===todayIdx(),d0=new Date(),nm=d0.getHours()*60+d0.getMinutes();
  const put=(row,name,host)=>{
    const t=timeOf(name);if(!t||!row)return;
    host.insertAdjacentHTML(host.classList.contains("meal-sum")?"beforebegin":"beforeend",'<span class="tchip">'+t[0]+'\u2013'+t[1]+'</span>');
    if(today&&nm>=toMin(t[0])&&nm<toMin(t[1]))row.classList.add("now");
  };
  app.querySelectorAll("input[data-task]").forEach(c=>{const row=c.closest(".task"),h=row&&row.querySelector(".task-name");if(h)put(row,c.dataset.task.split("-").slice(3).join("-"),h);});
  app.querySelectorAll("[data-meal-toggle]").forEach(h=>{const row=h.closest(".task"),s=h.querySelector(".meal-sum");if(row&&s)put(row,MEALS[+h.dataset.mealToggle.split("-")[1]],s);});
  app.querySelectorAll(".sportlink .task-name").forEach(h=>put(h.closest(".task"),"Тренировка",h));
}
function timesCard(){

    const r=await SC.call("/api/friends"),prev=new Set((s.friends||[]).filter(f=>f.inGym).map(f=>f.id));

    if(fOld!==null)s.friends.forEach(f=>{if(f.inGym&&!prev.has(f.id))showPush(f.name+" в зале","Твой друг "+f.name+" пришёл в зал");});
    fOld=true;save();
    const h=JSON.stringify(s.friends);if(h!==lastFr){lastFr=h;uiSoc();}
  }catch(e){}
}
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
render();
</script>
</body>
